name: Build and Push Multi-Arch Docker Image

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python for Test Harness
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'v2/requirements.lock'

      - name: Install reproducible dependencies (Q05)
        run: |
          pip install -r v2/requirements.lock

      - name: 🛡️ Run Test Harness Verification v1 (Baseline Gate)
        run: |
          python v1/harness_verify.py

      - name: 🛡️ Run Test Harness Verification v2 (Clean Architecture Gate)
        run: |
          python v2/harness_verify.py

      - name: Set up QEMU (for ARM64 support)
        uses: docker/setup-qemu-action@29109295f81e9208d7d86ff1c6c12d2833863392 # v3.6.0
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8ce7edddf772 # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push v2 multi-arch image with immutable SHA tag (Q05)
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: ./v2
          file: ./v2/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/manuel3200/streamvault-v2:${{ github.sha }}
            ghcr.io/manuel3200/streamvault-v2:v2
            ghcr.io/manuel3200/streamvault-v2:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
            ghcr.io/${{ github.repository }}:v2
            ghcr.io/${{ github.repository }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

