name: DevSecOps Autonomous Security & Robustness Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  security-audit:
    name: 🛡️ Security Audit & Robustness Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js for Security Pipeline
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'

      - name: 🚀 Run Autonomous Security Pipeline (SAST, Secrets, SCA, DAST)
        run: |
          chmod +x run_audit.sh
          ./run_audit.sh

      - name: 📄 Upload Security Audit Report Artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: security-audit-reports
          path: |
            SECURITY_AUDIT_REPORT.md
            security_audit_report.json
