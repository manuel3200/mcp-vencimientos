version: '3.8'

# ==============================================================================
# CHATWOOT COMMUNITY EDITION (ARM64 Compatible)
# Compatible con Oracle Cloud Ampere A1 (aarch64)
# 100% Autónomo: Crea su propia red y migra la BD en el primer arranque
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # 1. Base de datos PostgreSQL 15 con extensión Vector (ARM64)
  # ----------------------------------------------------------------------------
  chatwoot-postgres:
    image: pgvector/pgvector:pg15
    container_name: chatwoot-postgres
    restart: always
    environment:
      POSTGRES_DB: chatwoot_production
      POSTGRES_USER: chatwoot
      POSTGRES_PASSWORD: chatwoot_db_pass_2026
    volumes:
      - chatwoot_db_data:/var/lib/postgresql/data
    networks:
      - chatwoot-net

  # ----------------------------------------------------------------------------
  # 2. Redis para colas en segundo plano (Sidekiq) y WebSockets (ActionCable)
  # ----------------------------------------------------------------------------
  chatwoot-redis:
    image: redis:7-alpine
    container_name: chatwoot-redis
    restart: always
    volumes:
      - chatwoot_redis_data:/data
    networks:
      - chatwoot-net

  # ----------------------------------------------------------------------------
  # 3. Servidor Web Rails (Interfaz de Usuario y API de Chatwoot)
  # Prepara la BD automáticamente en el arranque antes de levantar el servidor
  # ----------------------------------------------------------------------------
  chatwoot-rails:
    image: chatwoot/chatwoot:v4.17.1-ce
    container_name: chatwoot-rails
    restart: always
    depends_on:
      - chatwoot-postgres
      - chatwoot-redis
    ports:
      - "3000:3000"
    entrypoint: docker/entrypoints/rails.sh
    command: ["sh", "-c", "bundle exec rails db:chatwoot_prepare && bundle exec rails s -p 3000 -b 0.0.0.0"]
    environment:
      - SECRET_KEY_BASE=j2ZWinsXioaVhCGTbxm7OSQTgJkxNGs0VIEh6DKEl80KUXzzIEhG87mewbYEHfw4
      - FRONTEND_URL=http://localhost:3000
      - DEFAULT_LOCALE=es
      - FORCE_SSL_MAILER=false
      - ENABLE_ACCOUNT_SIGNUP=true
      - REDIS_URL=redis://chatwoot-redis:6379
      - POSTGRES_HOST=chatwoot-postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DATABASE=chatwoot_production
      - POSTGRES_USERNAME=chatwoot
      - POSTGRES_PASSWORD=chatwoot_db_pass_2026
      - ACTIVE_STORAGE_SERVICE=local
      - NODE_ENV=production
      - RAILS_ENV=production
      - INSTALLATION_ENV=docker
      # Notificaciones push oficiales en la App de Celular (Android / iOS)
      - ENABLE_PUSH_RELAY_SERVER=true
      # Permitir enviar webhooks a contenedores Docker en la red interna
      - SAFE_FETCH_ALLOW_PRIVATE_NETWORK=true
    volumes:
      - chatwoot_storage_data:/app/storage
    networks:
      - chatwoot-net

  # ----------------------------------------------------------------------------
  # 4. Procesador en segundo plano Sidekiq (Webhooks, sincronización, mensajería)
  # ----------------------------------------------------------------------------
  chatwoot-sidekiq:
    image: chatwoot/chatwoot:v4.17.1-ce
    container_name: chatwoot-sidekiq
    restart: always
    depends_on:
      - chatwoot-postgres
      - chatwoot-redis
    entrypoint: docker/entrypoints/rails.sh
    command: ["sh", "-c", "sleep 10 && bundle exec sidekiq -C config/sidekiq.yml"]
    environment:
      - SECRET_KEY_BASE=j2ZWinsXioaVhCGTbxm7OSQTgJkxNGs0VIEh6DKEl80KUXzzIEhG87mewbYEHfw4
      - FRONTEND_URL=http://localhost:3000
      - DEFAULT_LOCALE=es
      - FORCE_SSL_MAILER=false
      - REDIS_URL=redis://chatwoot-redis:6379
      - POSTGRES_HOST=chatwoot-postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DATABASE=chatwoot_production
      - POSTGRES_USERNAME=chatwoot
      - POSTGRES_PASSWORD=chatwoot_db_pass_2026
      - ACTIVE_STORAGE_SERVICE=local
      - NODE_ENV=production
      - RAILS_ENV=production
      - INSTALLATION_ENV=docker
      - ENABLE_PUSH_RELAY_SERVER=true
      # Permitir enviar webhooks a contenedores Docker en la red interna
      - SAFE_FETCH_ALLOW_PRIVATE_NETWORK=true
    volumes:
      - chatwoot_storage_data:/app/storage
    networks:
      - chatwoot-net

# ------------------------------------------------------------------------------
# Persistencia de Datos
# ------------------------------------------------------------------------------
volumes:
  chatwoot_db_data:
    name: chatwoot_db_data
  chatwoot_redis_data:
    name: chatwoot_redis_data
  chatwoot_storage_data:
    name: chatwoot_storage_data

# ------------------------------------------------------------------------------
# Red interna dedicada (Sin dependencias externas)
# ------------------------------------------------------------------------------
networks:
  chatwoot-net:
    name: chatwoot-net
    driver: bridge
