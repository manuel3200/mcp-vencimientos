version: '3.8'

services:
  # Base de Datos PostgreSQL integrada y liviana (~80MB RAM)
  evolution-postgres:
    image: postgres:15-alpine
    container_name: evolution-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: evolution
      POSTGRES_PASSWORD: evolution_pass_2026
      POSTGRES_DB: evolution_db
    volumes:
      - evolution_postgres_data:/var/lib/postgresql/data
    networks:
      - evolution-net

  # Microservicio Oficial Evolution API v2 (WhatsApp Baileys)
  evolution-api:
    image: evoapicloud/evolution-api:v2.3.7
    container_name: evolution-api
    restart: unless-stopped
    depends_on:
      - evolution-postgres
    ports:
      - "8081:8080"
    environment:
      # URL pública o interna de acceso a la API
      - SERVER_URL=http://localhost:8081
      - DOCKER_ENV=true
      
      # Clave Secreta Global (API Key) para autenticar las peticiones del CRM
      - AUTHENTICATION_API_KEY=st@sFXf3gcz!C$
      
      # Conexión a la base de datos PostgreSQL integrada
      - DATABASE_PROVIDER=postgresql
      - DATABASE_CONNECTION_URI=postgresql://evolution:evolution_pass_2026@evolution-postgres:5432/evolution_db?schema=evolution_api
      - DATABASE_CONNECTION_CLIENT_NAME=evolution_exchange
      - DATABASE_SAVE_DATA_INSTANCE=true
      - DATABASE_SAVE_DATA_NEW_MESSAGE=true
      - DATABASE_SAVE_MESSAGE_UPDATE=true
      - DATABASE_SAVE_DATA_CONTACTS=true
      - DATABASE_SAVE_DATA_CHATS=true
      - DATABASE_SAVE_DATA_LABELS=true
      - DATABASE_SAVE_DATA_HISTORIC=false
      - DATABASE_SAVE_IS_ON_WHATSAPP=true
      - DATABASE_SAVE_IS_ON_WHATSAPP_DAYS=7
      - DATABASE_DELETE_MESSAGE=true

      # Configuración de Logging
      - LOG_LEVEL=ERROR,WARN,INFO
      - DEL_INSTANCE=false
      - CACHE_REDIS_ENABLED=false
      
      # Nombre visible en WhatsApp Web
      - CONFIG_SESSION_PHONE_CLIENT=Streaming CRM Bot
      - QRCODE_LIMIT=30

      # Habilitar integración nativa con Chatwoot
      - CHATWOOT_ENABLED=true
      - CHATWOOT_MESSAGE_READ=true
      - CHATWOOT_MESSAGE_DELETE=true
      - CHATWOOT_BOT_CONTACT=true
    volumes:
      # Persistencia de credenciales de WhatsApp y sesiones activas
      - evolution_instances:/evolution/instances
    networks:
      - evolution-net
      - chatwoot-net

volumes:
  evolution_instances:
    name: evolution_instances_data
  evolution_postgres_data:
    name: evolution_postgres_data

networks:
  evolution-net:
    name: evolution-net
  chatwoot-net:
    external: true
