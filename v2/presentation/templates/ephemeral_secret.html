<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StreamVault - Credencial Segura</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #0b0f19;
            color: #f1f5f9;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 16px;
        }
        .container {
            background: #161e2e;
            border: 1px solid #1e293b;
            border-radius: 16px;
            padding: 32px 24px;
            width: 100%;
            max-width: 460px;
            box-shadow: 0 10px 25px -5px rgba(0,0,0,0.5);
        }
        .icon-header {
            background: #1e293b;
            width: 60px;
            height: 60px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 16px auto;
            font-size: 30px;
        }
        h2 { text-align: center; margin: 0 0 6px 0; font-size: 1.35rem; color: #38bdf8; }
        p.subtitle { text-align: center; color: #94a3b8; font-size: 0.88rem; margin: 0 0 20px 0; }
        
        .alert-warning {
            background: #451a03;
            border: 1px solid #78350f;
            color: #fcd34d;
            padding: 12px 14px;
            border-radius: 10px;
            font-size: 0.82rem;
            line-height: 1.4;
            margin-bottom: 20px;
            display: flex;
            gap: 10px;
            align-items: flex-start;
        }
        .alert-burned {
            background: #450a0a;
            border: 1px solid #7f1d1d;
            color: #fca5a5;
            padding: 16px;
            border-radius: 12px;
            font-size: 0.9rem;
            line-height: 1.4;
            text-align: center;
            margin-bottom: 20px;
        }

        .credential-card {
            background: #0b0f19;
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 16px;
        }
        .credential-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #1e293b;
            padding-bottom: 10px;
            margin-bottom: 12px;
        }
        .platform-badge {
            background: #0284c7;
            color: white;
            font-size: 0.75rem;
            font-weight: 700;
            padding: 4px 10px;
            border-radius: 20px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .expiry-label {
            font-size: 0.78rem;
            color: #94a3b8;
        }

        .field-row {
            margin-bottom: 12px;
        }
        .field-row:last-child {
            margin-bottom: 0;
        }
        .field-label {
            font-size: 0.75rem;
            color: #94a3b8;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 4px;
        }
        .field-value-group {
            display: flex;
            align-items: center;
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 8px;
            overflow: hidden;
        }
        .field-input {
            flex: 1;
            background: transparent;
            border: none;
            padding: 10px 12px;
            color: #f1f5f9;
            font-family: monospace;
            font-size: 0.92rem;
            outline: none;
        }
        .btn-action {
            background: #334155;
            border: none;
            color: #cbd5e1;
            padding: 10px 12px;
            cursor: pointer;
            font-size: 0.82rem;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .btn-action:hover {
            background: #475569;
            color: #fff;
        }
        .btn-action:active {
            transform: scale(0.96);
        }

        .btn-destroy {
            width: 100%;
            background: #dc2626;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 12px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 10px;
        }
        .btn-destroy:hover {
            background: #b91c1c;
        }

        .footer {
            text-align: center;
            margin-top: 20px;
            font-size: 0.78rem;
            color: #64748b;
        }
    </style>
</head>
<body>
    <div class="container" id="mainContainer">
        {{CONTENT_HTML}}
    </div>

    <script>
        function copyField(elementId, btn) {
            const input = document.getElementById(elementId);
            if (!input) return;
            navigator.clipboard.writeText(input.value).then(() => {
                const originalText = btn.innerHTML;
                btn.innerHTML = "✅ ¡Copiado!";
                setTimeout(() => { btn.innerHTML = originalText; }, 1800);
            }).catch(() => {
                input.select();
                document.execCommand('copy');
                btn.innerHTML = "✅ ¡Copiado!";
                setTimeout(() => { btn.innerHTML = "📋 Copiar"; }, 1800);
            });
        }

        function toggleVisibility(elementId, btn) {
            const input = document.getElementById(elementId);
            if (!input) return;
            if (input.type === "password") {
                input.type = "text";
                btn.innerHTML = "🙈";
            } else {
                input.type = "password";
                btn.innerHTML = "👁️";
            }
        }

        function closeScreen() {
            const container = document.getElementById("mainContainer");
            container.innerHTML = `
                <div class="icon-header">🛡️</div>
                <h2 style="color: #6ee7b7;">Pantalla Limpiada</h2>
                <p class="subtitle">Tus datos han sido eliminados de la memoria local.</p>
                <div class="alert-warning" style="background: #064e3b; border-color: #047857; color: #6ee7b7; justify-content: center;">
                    Ya puedes cerrar esta pestaña de forma segura.
                </div>
            `;
        }
    </script>
</body>
</html>
